[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-agent"
version = "0.1.0"
description = "An autonomous AI agent that lives on a budget: double-entry ledger, task board, shadow pricing, observability dashboard, and a behavior-experiment framework."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "tiktoken>=0.5",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.3"]
enterprise = ["cryptography>=42.0"]

[project.scripts]
aria = "aria.cli:main"

[tool.setuptools.packages.find]
include = ["aria*", "marketplace*", "webapp*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml", "*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 单个测试超过 300 秒视为挂死并转储堆栈（防 CI runner 卡死整个 job）
timeout = "300"
